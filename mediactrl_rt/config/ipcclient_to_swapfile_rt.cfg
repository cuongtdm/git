# redundancy_mode: 1=active/active, 2=active/standby
# redundancy_state_preference: 0=none, 1=active, 2=standby
# link_downtime_on_failover_s: 0=disable, x=the amount of time, in seconds, that interfaces are down when the server fails over and goes to a standby state
# link_uptime_on_failover_s: 0=disable, x=the amount of time, in seconds, that interfaces are up when the server fails over and goes back to a active state
# session = session_name,action,system_id,password

[server_common]
	 connecting_timeout_ms = 1000
	 reconnecting_delay_s = 3
	 receiving_timeout_s = 600
	 sending_timeout_s = 1200
	 enquire_link_sending_period_s = 15
	 redundancy_mode = 1
	 link_downtime_on_failover_s = 0
	 link_uptime_on_failover_s = 0

[server]
	 name = SWAPFILE_RT
	 ip = 127.0.0.1
	 port = 9981
	 redundancy_state_preference = 0
	 link_downtime_on_failover_s = 0
	 link_uptime_on_failover_s = 0
	 session = SWAPFILE_RT1,keep,swap,swap
	 session = SWAPFILE_RT2,keep,swap,swap
	 session = SWAPFILE_RT3,keep,swap,swap
	 session = SWAPFILE_RT4,keep,swap,swap
	 session = SWAPFILE_RT5,keep,swap,swap
	 session = SWAPFILE_RT6,keep,swap,swap
